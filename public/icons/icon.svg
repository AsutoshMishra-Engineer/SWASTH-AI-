<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="swasthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#swasthGrad)"/>
  
  <!-- Outer Medical Shield / Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.3"/>
  
  <!-- Central Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="220" y="128" width="72" height="256" rx="20" fill="#ffffff"/>
    <!-- Horizontal Cross Bar -->
    <rect x="128" y="220" width="256" height="72" rx="20" fill="#ffffff"/>
    <!-- Central Stethoscope Pulse Line -->
    <path d="M160 256 H 210 L 235 210 L 265 300 L 290 240 L 310 256 H 352" 
          fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Subtitle Text inside Icon -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">SWASTH AI</text>
</svg>
